{% extends "base.html" %}
{% block content %}
<h1>Catálogo de libros</h1>
<form method="post" action="{{ url_for('nuevo_libro') }}">
    <input name="titulo" placeholder="Título" required>
    <input name="autor" placeholder="Autor" required>
    <input name="categoria" placeholder="Categoría">
    <input name="isbn" placeholder="ISBN">
    <input name="copias" type="number" min="1" value="1" placeholder="Copias">
    <button type="submit">Agregar</button>
</form>
<table>
    <tr><th>ID</th><th>Título</th><th>Autor</th><th>Categoría</th><th>Disponibles</th><th>Totales</th></tr>
    {% for l in libros %}
    <tr>
        <td>{{ l.id }}</td><td>{{ l.titulo }}</td><td>{{ l.autor }}</td>
        <td>{{ l.categoria }}</td><td>{{ l.copias_disponibles }}</td><td>{{ l.copias_totales }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
